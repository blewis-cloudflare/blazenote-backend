name = "blazenote-backend"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = [ "nodejs_compat" ]

# Custom domain configuration
[[routes]]
pattern = "blazenote-backend.successful-balance.sxplab.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "blazenote"
database_id = "7f0a3b0e-4c65-4f10-80a8-f5cc462a598d"
migrations_dir = "./migrations"

# [ai]
# binding = "AI"

# [[r2_buckets]]
# binding = "R2_BUCKET"
# bucket_name = "blazenote"
# preview_bucket_name = "dev-blazenote"

[observability.logs]
enabled = true